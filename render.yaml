# Render Blueprint — النشر المجاني على Render
# كيف يستخدمه Render: New → Blueprint → اختر هذا المستودع
# المتغير DATABASE_URL تُدخله يدويًا (sync: false) من قاعدة Neon المجانية
services:
  - type: web
    name: radiation-physics-index
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # ضع رابط قاعدة Neon المجانية هنا (Neon free ≠ انتهاء صلاحية مثل Render)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
